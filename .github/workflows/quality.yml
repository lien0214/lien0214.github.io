name: Quality Check

on:
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build
        run: hugo --minify
        env:
          HUGO_PARAMS_GAID: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost/en/
            http://localhost/en/projects/
            http://localhost/en/resume/
          staticDistDir: ./public
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
