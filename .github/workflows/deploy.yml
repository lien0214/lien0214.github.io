name: CI / Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  # ── Runs in parallel with quality ────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Build
        run: hugo --minify
        env:
          HUGO_PARAMS_GAID: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # ── Runs in parallel with build ──────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Build
        run: hugo --minify
        env:
          HUGO_PARAMS_GAID: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: Serve built site on port 3000
        run: python3 -m http.server 3000 --directory ./public &

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/en/ > /dev/null && echo "Server ready" && break
            echo "Attempt $i — waiting..."
            sleep 1
          done

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/en/
            http://localhost:3000/en/projects/
            http://localhost:3000/en/resume/
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ── Deploy only when both jobs above pass ─────────────────────────
  deploy:
    needs: [build, quality]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
