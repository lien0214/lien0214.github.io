<link rel="icon" type="image/svg+xml" href="/favicon.svg">
{{- with site.Params.gaID }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ . }}');
</script>
{{- end }}

{{- /* Default social image for pages without a cover photo */}}
{{- if not .Params.cover.image }}
<meta property="og:image" content="{{ "images/avatar/Portraits.jpg" | absURL }}">
<meta property="og:image:width" content="400">
<meta property="og:image:height" content="400">
<meta name="twitter:image" content="{{ "images/avatar/Portraits.jpg" | absURL }}">
{{- end }}

{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Yi-Wei Lien",
  "url": "{{ site.BaseURL }}"
}
</script>
